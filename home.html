<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Telethon Sessions — Admin Dashboard</title>
    <style>
      :root {
        --bg: #f7f8fb;
        --card: #ffffff;
        --muted: #6b7280;
        --accent: #2563eb;
        --border: #e6e9ef;
      }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: #0f172a;
        margin: 0;
        padding: 28px;
      }
      .wrap {
        max-width: 980px;
        margin: 0 auto;
      }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 18px;
      }
      h1 { font-size: 20px; margin: 0; }
      p.lead { margin: 0; color: var(--muted); font-size: 13px; }
      .controls { margin-left: auto; display: flex; gap: 8px; }
      button.btn {
        background: var(--accent);
        color: white;
        padding: 8px 12px;
        border-radius: 8px;
        border: 0;
        cursor: pointer;
        font-weight: 600;
      }
      button.ghost {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
      }
      .list { margin-top: 18px; display: flex; flex-direction: column; gap: 12px; }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        padding: 14px;
        border-radius: 10px;
      }
      .row { display: flex; align-items: center; gap: 12px; }
      .phone { font-weight: 700; font-size: 15px; }
      .meta { color: var(--muted); font-size: 13px; }
      details {
        margin-top: 10px;
        border-radius: 8px;
        border: 1px dashed var(--border);
        padding: 10px;
        background: #fafafa;
      }
      summary { cursor: pointer; font-weight: 600; }
      pre {
        white-space: pre-wrap;
        word-break: break-all;
        background: #0b1220;
        color: #e6eef8;
        padding: 12px;
        border-radius: 8px;
        font-size: 13px;
      }
      .actions { display: flex; gap: 8px; margin-top: 10px; }
      .small { font-size: 13px; color: var(--muted); }
      .empty { padding: 30px; text-align: center; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <h1>Telethon Active Sessions</h1>
          <p class="lead">Exported Telethon StringSession tokens stored in Firestore.</p>
        </div>
        <div class="controls">
          <button id="refreshBtn" class="btn">Refresh</button>
        </div>
      </header>

      <main>
        <div id="status" class="small">Loading…</div>
        <div id="list" class="list"></div>
        <div id="empty" class="empty" style="display: none">No accounts found.</div>
      </main>
    </div>

    <script>
      const listEl = document.getElementById("list");
      const statusEl = document.getElementById("status");
      const emptyEl = document.getElementById("empty");
      const refreshBtn = document.getElementById("refreshBtn");

      async function fetchAccounts() {
        statusEl.textContent = "Fetching accounts from server…";
        try {
          const res = await fetch("/brocodepizza?format=json", { cache: "no-store" });
          if (!res.ok) throw new Error("Server returned " + res.status);
          const accounts = await res.json();
          renderAccounts(accounts || []);
          statusEl.textContent = `Loaded ${accounts.length} account(s)`;
        } catch (err) {
          statusEl.textContent = "Error fetching accounts: " + err.message;
          listEl.innerHTML = "";
          emptyEl.style.display = "block";
        }
      }

      function renderAccounts(accounts) {
        listEl.innerHTML = "";
        if (!accounts.length) {
          emptyEl.style.display = "block";
          return;
        }
        emptyEl.style.display = "none";

        accounts.forEach((doc, idx) => {
          const phone = doc.phone_number || "unknown";
          const created = doc.created_at ? ` • ${new Date(doc.created_at).toLocaleString()}` : "";
          const sessionStr = doc.string_session || "No StringSession found";

          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <div class="row">
              <div>
                <div class="phone">${escapeHtml(phone)}</div>
                <div class="meta">Account #${idx + 1}${created}</div>
              </div>
            </div>
            <details>
              <summary>View Telethon StringSession Token</summary>
              <pre id="token-${idx}">${escapeHtml(sessionStr)}</pre>
              <div class="actions">
                <button class="btn copy-btn" data-idx="${idx}">Copy Token</button>
              </div>
            </details>
          `;
          listEl.appendChild(card);
        });

        listEl.querySelectorAll(".copy-btn").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const idx = btn.dataset.idx;
            const pre = document.getElementById(`token-${idx}`);
            if (!pre) return;
            await navigator.clipboard.writeText(pre.textContent);
            btn.textContent = "Copied ✓";
            setTimeout(() => (btn.textContent = "Copy Token"), 1300);
          });
        });
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      refreshBtn.addEventListener("click", fetchAccounts);
      fetchAccounts();
    </script>
  </body>
</html>
